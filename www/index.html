html,body{height:100%;margin:0;overflow:hidden}

.tile{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:10px 14px;min-width:0}

label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}

.sbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);border:1px solid var(--bd);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}

.ocr{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin-top:6px}
#login{max-width:380px;margin:12vh auto;padding:0 16px}#login h2{margin-top:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px}
.scrolly{overflow:auto}
@media print{header,nav,.acts,.pager{display:none!important}html,body{overflow:visible}}

/* ---------- routing / auth ---------- */
async function boot(){
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;
  const m=location.hash.match(/^#\/verify\/(.+)$/);
  if(m){return renderVerify(decodeURIComponent(m[1]))}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return renderLogin()}
  S.user=session.user;
  try{
    const ok=await rpc('is_admin');
    if(!ok){await sb.auth.signOut();return renderLogin('Accès réservé à l\'administrateur')}
    S.units=await q(sb.from('units').select('id,unit_number,monthly_fee').is('deleted_at',null).order('unit_number'));
    S.cats=await q(sb.from('expense_categories').select('id,name').eq('is_active',true).order('name'));
  }catch(e){return renderLogin(e.message)}
  render();
}
function renderLogin(err){
  $('#app').innerHTML=`<div id="login"><div class="card"><h2>${esc(t('app'))} – ${esc(t('login'))}</h2>
  ${err?`<div class="msg err">${esc(err)}</div>`:''}
  <label>${t('email')}</label><input id="em" type="email" autocomplete="username">
  <label>${t('pwd')}</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" style="width:100%" id="go">${t('signin')}</button>
  <button class="btn sec" style="width:100%" onclick="setLang(lang==='fr'?'ar':'fr')">${t('lang')}</button></div></div>`;
  $('#go').onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)return renderLogin(error.message);boot()};
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
}
async function renderVerify(token){
  $('#app').innerHTML=`<div id="login"><div class="card"><h2>${t('verify')}</h2><div id="vr">…</div></div></div>`;
  try{
    const r=await rpc('verify_receipt',{p_token:token});
    const cls=r.valid?'ok':'err',txt=r.valid?t('valid'):(r.status==='unknown'?t('unknown'):t('invalid'));
    $('#vr').innerHTML=`<div class="msg ${cls}"><b>${esc(txt)}</b></div>`+(r.receipt_number?`<p>N° ${esc(r.receipt_number)}<br>${esc(r.unit)} – ${esc(r.building)}<br>${money(r.amount)} – ${esc(r.payment_date)}</p>`:'');
  }catch(e){$('#vr').innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}

async dash(){
  const [c,fl,ub]=await Promise.all([load('cash',()=>q(sb.from('v_cash_summary').select('*').limit(1))),load('flows',()=>q(sb.from('v_monthly_flows').select('*').order('month',{ascending:false}).limit(12))),load('ub',()=>q(sb.from('v_unit_balances').select('*').order('unit_number')))]);

  const rows=await load('dues',()=>q(sb.from('v_dues_detail').select('*').order('period_year',{ascending:false}).order('period_month',{ascending:false}).limit(400)));

const POLICES={'0158226':'EAU','01582826':'EAU','0637128':'ELECTRICITE'};

  const norm=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function loadScript(src){return new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>ko(new Error('Chargement impossible (connexion ?)'));document.head.appendChild(e)})}
async function prep(src,o={}){
  // o.red : lit le canal rouge (les cases orange « Net à payer » y deviennent blanches, le texte noir reste noir)
  // o.y0/o.y1 : ne garde qu'une bande horizontale de la page (0 à 1)
  let bmp;if(src instanceof HTMLCanvasElement){bmp=src}else{bmp=await createImageBitmap(src,{imageOrientation:'from-image'})}
  const w=bmp.width,h=bmp.height,y0=Math.round(h*(o.y0||0)),sh=Math.round(h*((o.y1||1)))-y0,k=Math.min(2.2,2600/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(sh*k);
  const c=cv.getContext('2d');
  if(o.red){c.drawImage(bmp,0,y0,w,sh,0,0,cv.width,cv.height);
    const d=c.getImageData(0,0,cv.width,cv.height),p=d.data;
    for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-128)*1.8+128));p[i]=p[i+1]=p[i+2]=v}
    c.putImageData(d,0,0)}
  else{c.filter='grayscale(1) contrast(1.5) brightness(1.05)';c.drawImage(bmp,0,y0,w,sh,0,0,cv.width,cv.height)}
  return cv}
async function ocrImage(src){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js');
  const wk=await Tesseract.createWorker('fra');
  try{
    await wk.setParameters({tessedit_pageseg_mode:'11'});
    const t1=(await wk.recognize(await prep(src))).data.text;
    // 2e passe : bande basse de la facture (net à payer, timbre) lue sur le canal rouge
    await wk.setParameters({tessedit_pageseg_mode:'6'});
    let t2='';try{t2=(await wk.recognize(await prep(src,{red:true,y0:.62,y1:.97}))).data.text}catch(e){}
    return t1+'\n'+t2
  }finally{await wk.terminate()}}
async function ocrText(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let all='';
    for(let i=1;i<=Math.min(pdf.numPages,4);i++){
      const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
      let txt='',lastY=null;for(const it of tc.items){if(lastY!==null&&Math.abs(it.transform[5]-lastY)>2)txt+='\n';else if(txt)txt+=' ';txt+=it.str;lastY=it.transform[5]}
      if(txt.replace(/\s/g,'').length<40){const vp=pg.getViewport({scale:2.5});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;txt=await ocrImage(cv)}
      all+='\n'+txt}
    return all}
  return ocrImage(file)}
function parseAmounts(line){const out=[];const re=/\d{1,3}(?:[  .]\d{3})*[.,]\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g;let m;
  while((m=re.exec(line))){let x=m[0].replace(/[\s ]/g,'');
    if(/,\d{2}$/.test(x))x=x.replace(/\./g,'').replace(',','.');else x=x.replace(/,/g,'');
    const v=parseFloat(x);if(isFinite(v)&&v>0)out.push(v)}return out}
function parseInvoice(text){
  const flat=text.replace(/[\s.\-]/g,'');
  const found=Object.keys(POLICES).filter(p=>flat.includes(p));
  const types=[...new Set(found.map(p=>POLICES[p]))];
  if(types.length!==1)return {type:null};
  const police=found[0],type=types[0];
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const bad=/ancien|solde|report|arri[eé]r|d[eé]j[àa]\s*pay/i;
  const all=[];lines.forEach(l=>{if(!bad.test(l))all.push(...parseAmounts(l))});
  const biggest=Math.max(0,...all);
  // 1) libellé lu : « Net à payer » / « Total TTC »
  const pass=[/net\s*[àa]\s*payer|total\s*[àa]\s*payer|montant\s*[àa]\s*payer/i,/total\s*ttc|montant\s*ttc|net\s*ttc|\bttc\b/i];
  for(const re of pass){
    const cands=[];
    lines.forEach((l,i)=>{if(!re.test(l)||bad.test(l))return;
      if(/\bHT\b/i.test(l)&&!/ttc/i.test(l))return;
      let a=parseAmounts(l);if(!a.length&&lines[i+1]&&!bad.test(lines[i+1]))a=parseAmounts(lines[i+1]);
      a=a.filter(v=>v>1||v>=biggest);// un petit montant (≤ 1 MAD) est le droit de timbre
      if(a.length)cands.push(a)});
    if(cands.length){const last=cands[cands.length-1];const amount=last[last.length-1];
      return {type,police,amount,others:last.slice(0,-1),deduced:false}}
  }
  // 2) libellé non lu (photo) : sur ces factures le net à payer est l'avant-dernier montant, suivi du droit de timbre
  if(all.length>=2){
    const a=[...all];let timbre=null;if(a[a.length-1]<=1)timbre=a.pop();
    const amount=a[a.length-1];
    if(timbre!==null&&amount>=Math.max(...a))return {type,police,amount,others:a.slice(0,-1).slice(-3),timbre,deduced:true}}
  return {type,police,amount:null,others:[]}}
async function attachFile(expenseId,f){
  const ext=(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5);
  const path=`expenses/${expenseId}/${uuid()}.${ext}`;
  const up=await sb.storage.from('syndic-documents').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(up.error)throw new Error('Dépense enregistrée, mais justificatif non envoyé : '+up.error.message);
  const bid=(await q(sb.from('buildings').select('id').limit(1)))[0].id;
  await q(sb.from('attachments').insert({building_id:bid,storage_path:path,file_name:f.name.slice(0,120),mime_type:f.type,file_size:f.size,expense_id:expenseId}))}
