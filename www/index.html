        nav button.active { background: #2E7D32; color: white; }
        main { padding: 20px; max-width: 960px; margin: 0 auto; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }

        .card .value { font-size: 1.4rem; font-weight: 700; color: #2E7D32; margin-top: 4px; }

        .section h2 { font-size: 1.1rem; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; }
        th { font-size: 0.85rem; color: #666; }
        .status-paid { color: #2E7D32; font-weight: 600; }
        .status-partial { color: #f57c00; font-weight: 600; }
        .status-unpaid { color: #d32f2f; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .badge-paid { background: #e8f5e9; color: #2E7D32; }
        .badge-partial { background: #fff3e0; color: #f57c00; }
        .badge-unpaid { background: #ffebee; color: #d32f2f; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #2E7D32; color: white; }
        .btn-secondary { background: #e0e0e0; }
        .month-scroll { max-height: 160px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; background: white; }
        .month-item { padding: 10px 14px; cursor: pointer; }
        .month-item:hover, .month-item.selected { background: #e8f5e9; }
        .filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: end; }
        .filters .form-group { margin: 0; min-width: 140px; }
    </style>
</head>

<body>
    <header>
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="8" fill="white"/>
            <path d="M8 28V16L20 8L32 16V28H24V20H16V28H8Z" fill="#2E7D32"/>
        </svg>
        <h1>Syndic - Gestion de copropriété</h1>
        <a class="apk-btn" id="apkDownload" href="https://github.com/sariyoune-png/syndic-app/releases/download/v1.0.0/Syndic-release.apk" download>Télécharger l'APK</a>
    </header>
    <nav>
        <button class="active" data-section="dashboard">Accueil</button>
        <button data-section="apartments">Appartements</button>
        <button data-section="cotisations">Cotisations</button>
        <button data-section="expenses">Dépenses</button>
        <button data-section="treasury">Trésorerie</button>
        <button data-section="add">Ajouter</button>
    </nav>
    <main id="content">
        <div class="loading">Chargement...</div>
    </main>

    <script>
        const SUPABASE_URL = 'https://nactxqbnqcdbklddmraa.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_vuD8aWG-MEhraGtGPFp2tg_YrSiL1NX';
        let sb;
        try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

        let selectedMonth = new Date().getMonth() + 1;
        let selectedYear = 2026;
        const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

        document.querySelectorAll('nav button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                loadSection(this.dataset.section);
            });
        });

        // Masquer le bouton APK si on est déjà dans l'application Android
        if (window.Capacitor || /Android/i.test(navigator.userAgent) && window.location.protocol === 'capacitor:') {
            const apkBtn = document.getElementById('apkDownload');
            if (apkBtn) apkBtn.style.display = 'none';
        }

        async function loadSection(section) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Chargement...</div>';
            try {
                if (section === 'dashboard') await loadDashboard();
                else if (section === 'apartments') await loadApartments();
                else if (section === 'cotisations') await loadCotisations();
                else if (section === 'expenses') await loadExpenses();
                else if (section === 'treasury') await loadTreasury();
                else if (section === 'add') showAddForm();
            } catch (err) {
                content.innerHTML = '<div class="error">Erreur : ' + err.message + '</div>';
            }
        }

        async function loadDashboard() {
            const { data: dash } = await sb.from('v_dashboard').select().single();
            const { data: dues } = await sb.from('dues').select('amount, status');
            const outstanding = (dues || []).reduce((sum, d) => {
                return sum + (d.status !== 'paid' && d.status !== 'cancelled' ? parseFloat(d.amount) || 0 : 0);
            }, 0);

            const { data: expenses } = await sb.from('expenses').select('amount, status');
            const paidExpenses = (expenses || []).filter(e => e.status === 'paid').reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
            const pendingExpenses = (expenses || []).filter(e => e.status === 'pending').reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);

            // Valeurs de référence Excel
            const totalEncaissements = 3412;
            const totalDepenses = 3271.36;
            const solde = 140.64;

            document.getElementById('content').innerHTML = `
                <div class="cards">
                    <div class="card"><div class="label">Solde trésorerie</div><div class="value" style="color:#2E7D32;">${solde.toFixed(2)} MAD</div></div>
                    <div class="card"><div class="label">Impayés</div><div class="value" style="color:#d32f2f;">-${outstanding.toFixed(2)} MAD</div></div>
                    <div class="card"><div class="label">Total encaissements</div><div class="value">${totalEncaissements.toFixed(2)} MAD</div></div>
                    <div class="card"><div class="label">Total dépenses</div><div class="value">${totalDepenses.toFixed(2)} MAD</div></div>
                </div>
                <div class="section">
                    <h2>Résumé (référence Excel)</h2>
                    <p>Cotisations copropriétaires : <strong>2 800.00 MAD</strong></p>
                    <p>Cotisation spéciale débouchage : <strong>612.00 MAD</strong></p>
                    <p>Femme de ménage : <strong>1 500.00 MAD</strong></p>
                    <p>Achats : <strong>265.00 MAD</strong></p>
                    <p>Autres dépenses : <strong>1 506.36 MAD</strong></p>
                    <p>Dépenses en attente : <strong>${pendingExpenses.toFixed(2)} MAD</strong></p>
                    <p>Nombre d'appartements : <strong>${dash?.unit_count || 4}</strong></p>
                </div>
            `;
        }

        async function loadApartments() {
            const { data, error } = await sb.from('v_unit_financial_status').select().order('unit_number');
            if (error) throw error;
            let rows = data.map(u => {
                const remaining = u.outstanding || 0;
                const paid = u.total_paid || 0;
                let status, cls, badge;
                if (remaining <= 0) { status = 'Payé'; cls = 'status-paid'; badge = 'badge-paid'; }
                else if (paid > 0) { status = 'Partiel'; cls = 'status-partial'; badge = 'badge-partial'; }
                else { status = 'Impayé'; cls = 'status-unpaid'; badge = 'badge-unpaid'; }
                return `<tr>
                    <td><strong>${u.unit_number}</strong></td>
                    <td>${paid} MAD</td>
                    <td>${remaining} MAD</td>
                    <td><span class="badge ${badge}">${status}</span></td>
                </tr>`;
            }).join('');
            document.getElementById('content').innerHTML = `
                <div class="section">
                    <h2>Appartements</h2>
                    <table>
                        <thead><tr><th>Appartement</th><th>Payé</th><th>Reste</th><th>Statut</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        async function loadCotisations() {
            const { data: units } = await sb.from('units').select('id, unit_number').order('unit_number');
            const monthItems = months.map((m, i) => 
                `<div class="month-item ${i+1 === selectedMonth ? 'selected' : ''}" data-month="${i+1}">${m}</div>`
            ).join('');

            document.getElementById('content').innerHTML = `
                <div class="section">
                    <h2>Cotisations</h2>
                    <div class="filters">
                        <div class="form-group">
                            <label>Année</label>
                            <select id="cotYear" onchange="selectedYear=parseInt(this.value); loadCotisations()">
                                <option value="2026" ${selectedYear===2026?'selected':''}>2026</option>
                                <option value="2025" ${selectedYear===2025?'selected':''}>2025</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex:1; min-width:180px;">
                            <label>Mois</label>
                            <div class="month-scroll" id="cotMonthScroll">${monthItems}</div>
                        </div>
                    </div>
                    <div id="cotList"><div class="loading">Chargement...</div></div>
                </div>
            `;

            document.querySelectorAll('#cotMonthScroll .month-item').forEach(item => {
                item.addEventListener('click', function() {
                    selectedMonth = parseInt(this.dataset.month);
                    document.querySelectorAll('#cotMonthScroll .month-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    loadCotisationsForMonth();
                });
            });

            loadCotisationsForMonth();
        }

        async function loadCotisationsForMonth() {
            const { data: units } = await sb.from('units').select('id, unit_number').order('unit_number');
            const { data: dues } = await sb.from('dues')
                .select('unit_id, amount, status')
                .eq('period_year', selectedYear)
                .eq('period_month', selectedMonth);

            const duesMap = {};
            (dues || []).forEach(d => { duesMap[d.unit_id] = d; });

            let rows = (units || []).map(u => {
                const due = duesMap[u.id];
                const amount = due ? due.amount : 100;
                const status = due ? due.status : 'pending';
                const label = status === 'paid' ? 'Payé' : (status === 'partial' ? 'Partiel' : 'Impayé');
                const badge = status === 'paid' ? 'badge-paid' : (status === 'partial' ? 'badge-partial' : 'badge-unpaid');
                return `<tr>
                    <td><strong>${u.unit_number}</strong></td>
                    <td>${amount} MAD</td>
                    <td><span class="badge ${badge}">${label}</span></td>
                </tr>`;
            }).join('');

            document.getElementById('cotList').innerHTML = `
                <table>
                    <thead><tr><th>Appartement</th><th>Montant</th><th>Statut</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function loadExpenses() {
            const { data, error } = await sb.from('expenses').select().order('expense_date', { ascending: false }).limit(50);
            if (error) throw error;
            let rows = data.map(e => `<tr>
                <td>${e.expense_date}</td>
                <td>${e.description}</td>
                <td>${e.amount} MAD</td>
                <td>${e.status}</td>
            </tr>`).join('');
            document.getElementById('content').innerHTML = `
                <div class="section">
                    <h2>Dépenses</h2>
                    <table>
                        <thead><tr><th>Date</th><th>Description</th><th>Montant</th><th>Statut</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        async function loadTreasury() {
            const { data: balance } = await sb.from('v_treasury_balance').select().single();
            const { data: movements, error } = await sb.from('treasury_movements').select().order('movement_date', { ascending: false }).limit(40);
            if (error) throw error;
            let rows = movements.map(m => `<tr>
                <td>${m.movement_date}</td>
                <td>${m.description}</td>
                <td>${m.movement_type}</td>
                <td style="color:${m.amount >= 0 ? '#2E7D32' : '#d32f2f'}; font-weight:600;">${m.amount} MAD</td>
            </tr>`).join('');
            document.getElementById('content').innerHTML = `
                <div class="cards">
                    <div class="card">
                        <div class="label">Solde disponible</div>
                        <div class="value">${balance?.current_balance || 0} MAD</div>
                    </div>
                </div>
                <div class="section">
                    <h2>Journal de trésorerie</h2>
                    <table>
                        <thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Montant</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function showAddForm() {
            const monthOptions = months.map((m, i) => `<div class="month-item" data-month="${i+1}">${m}</div>`).join('');
            document.getElementById('content').innerHTML = `
                <div class="section">
                    <h2>Ajouter une opération</h2>
                    <div class="filters">
                        <div class="form-group">
                            <label>Année</label>
                            <select id="yearSelect">
                                <option value="2026" selected>2026</option>
                                <option value="2025">2025</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Mois</label>
                            <div class="month-scroll" id="monthScroll">${monthOptions}</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="opType">
                            <option value="payment">Paiement de cotisation</option>
                            <option value="expense">Dépense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Appartement</label>
                        <select id="unitSelect"></select>
                    </div>
                    <div class="form-group">
                        <label>Montant (MAD)</label>
                        <input type="number" id="amount" step="0.01" value="100">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="desc" placeholder="Description">
                    </div>
                    <button class="btn btn-primary" onclick="saveOperation()">Enregistrer</button>
                </div>
            `;
            loadUnitsForSelect();
            document.querySelectorAll('.month-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.month-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedMonth = parseInt(this.dataset.month);
                });
            });
        }

        async function loadUnitsForSelect() {
            const { data } = await sb.from('units').select('id, unit_number').order('unit_number');
            const sel = document.getElementById('unitSelect');
            if (sel && data) {
                sel.innerHTML = data.map(u => `<option value="${u.id}">${u.unit_number}</option>`).join('');
            }
        }

        async function saveOperation() {
            const type = document.getElementById('opType').value;
            const unitId = document.getElementById('unitSelect').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const desc = document.getElementById('desc').value || 'Opération';
            const year = parseInt(document.getElementById('yearSelect').value);

            if (!confirm('Confirmer l\'enregistrement ?')) return;

            try {
                if (type === 'payment') {
                    const { data: due } = await sb.from('dues').select('id').eq('unit_id', unitId).eq('period_year', year).eq('period_month', selectedMonth).single();
                    const { data: payment, error } = await sb.from('payments').insert({
                        unit_id: unitId,
                        building_id: 'a1111111-1111-1111-1111-111111111111',
                        amount: amount,
                        payment_date: new Date().toISOString().split('T')[0]
                    }).select().single();
                    if (error) throw error;
                    if (due) {
                        await sb.from('payment_allocations').insert({ payment_id: payment.id, due_id: due.id, amount: amount });
                        await sb.from('dues').update({ status: 'paid' }).eq('id', due.id);
                    }
                    await sb.from('treasury_movements').insert({
                        building_id: 'a1111111-1111-1111-1111-111111111111',
                        movement_type: 'receipt',
                        amount: amount,
                        movement_date: new Date().toISOString().split('T')[0],
                        description: desc,
                        payment_id: payment.id
                    });

                    // Génération du reçu
                    const { data: unit } = await sb.from('units').select('unit_number').eq('id', unitId).single();
                    const { data: numData, error: numError } = await sb.rpc('generate_receipt_number');
                    if (numError) {
                        alert('Erreur numérotation : ' + numError.message);
                        return;
                    }
                    const { data: receipt, error: recError } = await sb.from('receipts').insert({
                        payment_id: payment.id,
                        receipt_number: numData,
                        unit_id: unitId,
                        owner_name: unit?.unit_number || '',
                        amount: amount,
                        payment_reason: 'cotisation',
                        period_year: year,
                        period_month: selectedMonth,
                        status: 'valid'
                    }).select().single();
                    if (recError) {
                        alert('Erreur reçu : ' + recError.message);
                    } else {
                        generatePDF(receipt, unit?.unit_number);
                    }
                } else {
                    const { data: expense, error } = await sb.from('expenses').insert({
                        building_id: 'a1111111-1111-1111-1111-111111111111',
                        description: desc,
                        amount: amount,
                        expense_date: new Date().toISOString().split('T')[0],
                        status: 'paid'
                    }).select().single();
                    if (error) throw error;
                    await sb.from('treasury_movements').insert({
                        building_id: 'a1111111-1111-1111-1111-111111111111',
                        movement_type: 'expense',
                        amount: -amount,
                        movement_date: new Date().toISOString().split('T')[0],
                        description: desc,
                        expense_id: expense.id
                    });
                }
                alert('Enregistré avec succès');
                loadSection('dashboard');
            } catch (err) {
                alert('Erreur : ' + err.message);
            }
        }

        function generatePDF(receipt, ownerName) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.setTextColor(46, 125, 50);
            doc.text('Immeuble Syndic', 105, 20, { align: 'center' });
            doc.setFontSize(14);
            doc.setTextColor(0);
            doc.text('REÇU DE PAIEMENT', 105, 32, { align: 'center' });
            doc.setFontSize(11);
            doc.text(`N° ${receipt.receipt_number}`, 20, 50);
            doc.text(`Propriétaire : ${ownerName || receipt.owner_name}`, 20, 60);
            doc.text(`Montant : ${receipt.amount} MAD`, 20, 70);
            doc.text(`Motif : ${receipt.payment_reason}`, 20, 80);
            doc.text(`Période : ${receipt.period_month}/${receipt.period_year}`, 20, 90);
            doc.text(`Date : ${new Date().toLocaleDateString('fr-FR')}`, 20, 100);
            doc.text('Statut : VALIDE', 20, 110);
            doc.setFontSize(9);
            doc.text('Signature du syndic : _________________', 20, 140);
            // QR Code
            const qrDiv = document.createElement('div');
            new QRCode(qrDiv, { text: `https://glowing-travesseiro-8a4ef9.netlify.app/verification/${receipt.verification_token}`, width: 80, height: 80 });
            setTimeout(() => {
                const canvas = qrDiv.querySelector('canvas');
                if (canvas) doc.addImage(canvas.toDataURL(), 'PNG', 140, 50, 50, 50);
                doc.save(`Recu_${receipt.receipt_number}.pdf`);
            }, 500);
        }

        loadSection('dashboard');
    </script>
</body>
</html>
