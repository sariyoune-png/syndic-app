<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syndic v5 – Gestion de copropriété</title>
<style>
:root{--bg:#f1f4f8;--card:#fff;--tx:#17212b;--mu:#667386;--pr:#0b6b4f;--prd:#08503b;--rd:#c0392b;--or:#d98a00;--bd:#e1e6ed;--ok:#1f9d6b;--pa:#f0a92e;--pe:#e0594b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1319;--card:#18202a;--tx:#e8edf3;--mu:#98a3b3;--pr:#2fb386;--prd:#1f8c68;--rd:#ef6a5b;--or:#f0b13b;--bd:#27313d;--ok:#2fb386;--pa:#f0b13b;--pe:#ef6a5b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{height:100dvh;display:flex;flex-direction:column}
header{flex:none;height:46px;background:var(--pr);color:#fff;padding:0 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;flex:1}header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px}
main{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
nav{flex:none;height:calc(54px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--bd);display:flex}
nav a{flex:1;text-align:center;padding-top:7px;font-size:10.5px;color:var(--mu);text-decoration:none}nav a.on{color:var(--pr);font-weight:700}nav a span{display:block;font-size:18px;line-height:1.1}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 11px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.kpi small{display:block;color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi b{display:block;font-size:clamp(15px,5vw,21px);white-space:nowrap}
.kpi.big b{font-size:clamp(24px,8vw,34px)}
.neg{color:var(--rd)}.pos{color:var(--pr)}.warn{color:var(--or)}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}
.ttl{font-size:12px;color:var(--mu);font-weight:600;margin-bottom:4px;display:flex;gap:10px;align-items:center}
.bars{flex:1;min-height:60px;display:flex;gap:3px}
.bars .col{flex:1;display:flex;flex-direction:column;min-width:0}.bars .pair{flex:1;position:relative}.bars .pair i{position:absolute;bottom:0;width:calc(50% - 1px);border-radius:3px 3px 0 0;min-height:1px}
.bars .pair i.a{inset-inline-start:0;background:var(--ok)}.bars .pair i.b{inset-inline-end:0;background:var(--pe)}
.bars em{font-style:normal;font-size:9px;color:var(--mu);text-align:center;margin-top:2px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.unit b{font-size:14px}.unit .pb{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:5px 0 3px}.unit .pb i{display:block;height:100%;background:var(--ok)}
.unit small{color:var(--mu);font-size:11px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;background:#fbd9d4;color:#8a1d12;margin-inline-start:4px}
.heat{flex:1;min-height:0;display:grid;grid-template-columns:62px repeat(12,1fr);grid-auto-rows:1fr;gap:3px;align-items:stretch}
.heat .h{font-size:9.5px;color:var(--mu);text-align:center;align-self:end}.heat .u{font-size:12px;font-weight:600;display:flex;align-items:center;cursor:pointer;color:var(--pr)}
.heat .c{border-radius:5px;background:var(--bd)}.heat .c.paid{background:var(--ok)}.heat .c.partial{background:var(--pa)}.heat .c.pending{background:var(--pe)}
.legend{display:flex;gap:10px;font-size:10.5px;color:var(--mu);flex:none;flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:3px}
.cats{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden;justify-content:space-around}
.cat{display:grid;grid-template-columns:78px 1fr auto;gap:6px;align-items:center;font-size:12px}.cat .pb{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.cat .pb i{display:block;height:100%;background:var(--pr)}
.li{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12.5px;min-height:38px}.li:last-child{border:0}
.li .d{flex:1;min-width:0}.li .d b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.li .d small{color:var(--mu);font-size:11px}.li .am{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.list{flex:none}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);padding-top:4px}.pager button{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;width:38px;height:28px;font-size:15px}.pager button:disabled{opacity:.35}
.btn{background:var(--pr);color:#fff;border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:600;flex:1}.btn.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.sm{padding:4px 8px;font-size:12px;flex:none;border-radius:8px}.btn.dg{background:var(--rd)}.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;flex:none}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.msg{padding:9px;border-radius:8px;margin:8px 0;font-size:13px}.msg.err{background:#fbd9d4;color:#8a1d12}.msg.ok{background:#d6f3e6;color:#075e3f}
.toast{position:fixed;top:54px;inset-inline:12px;z-index:50;max-width:616px;margin:0 auto;padding:10px 12px;border-radius:10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.25)}.toast.ok{background:#0b6b4f;color:#fff}.toast.err{background:#c0392b;color:#fff}
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:16px;margin:0 0 4px}
.ocr{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin-top:6px}
#login{max-width:380px;margin:12vh auto;padding:0 16px}#login h2{margin-top:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.scrolly{overflow:auto}
@media print{header,nav,.acts,.pager{display:none!important}html,body{overflow:visible}}
</style>
</head>

let lang=(()=>{try{return localStorage.getItem('lang')||'fr'}catch(e){return 'fr'}})();

let S={tab:'dash',units:[],cats:[],msg:null,user:null};

function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw new Error(error.message);return data}
async function q(p){const {data,error}=await p;if(error)throw new Error(error.message);return data}

/* ---------- routing / auth ---------- */
async function boot(){
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;
  const m=location.hash.match(/^#\/verify\/(.+)$/);
  if(m){return renderVerify(decodeURIComponent(m[1]))}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return renderLogin()}
  S.user=session.user;
  try{
    const ok=await rpc('is_admin');
    if(!ok){await sb.auth.signOut();return renderLogin('Accès réservé à l\'administrateur')}
    S.units=await q(sb.from('units').select('id,unit_number,monthly_fee').is('deleted_at',null).order('unit_number'));
    S.cats=await q(sb.from('expense_categories').select('id,name').eq('is_active',true).order('name'));
  }catch(e){return renderLogin(e.message)}
  render();
}
function renderLogin(err){
  $('#app').innerHTML=`<div id="login"><div class="card"><h2>${esc(t('app'))} – ${esc(t('login'))}</h2>
  ${err?`<div class="msg err">${esc(err)}</div>`:''}
  <label>${t('email')}</label><input id="em" type="email" autocomplete="username">
  <label>${t('pwd')}</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" style="width:100%" id="go">${t('signin')}</button>
  <button class="btn sec" style="width:100%" onclick="setLang(lang==='fr'?'ar':'fr')">${t('lang')}</button></div></div>`;
  $('#go').onclick=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)return renderLogin(error.message);boot()};
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
}
async function renderVerify(token){
  $('#app').innerHTML=`<div id="login"><div class="card"><h2>${t('verify')}</h2><div id="vr">…</div></div></div>`;
  try{
    const r=await rpc('verify_receipt',{p_token:token});
    const cls=r.valid?'ok':'err',txt=r.valid?t('valid'):(r.status==='unknown'?t('unknown'):t('invalid'));
    $('#vr').innerHTML=`<div class="msg ${cls}"><b>${esc(txt)}</b></div>`+(r.receipt_number?`<p>N° ${esc(r.receipt_number)}<br>${esc(r.unit)} – ${esc(r.building)}<br>${money(r.amount)} – ${esc(r.payment_date)}</p>`:'');
  }catch(e){$('#vr').innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
function shell(body){
  const tabs=[['dash','🏠',t('dash')],['dues','📅',t('dues')],['exp','🧾',t('exp')],['treas','💰',t('treas')],['more','☰',t('more')]];
  $('#app').innerHTML=`<header><h1>${t('app')}</h1><button onclick="setLang(lang==='fr'?'ar':'fr')">${t('lang')}</button><button onclick="sb.auth.signOut().then(boot)">${t('logout')}</button></header>
  <main>${body}</main><nav>${tabs.map(([k,i,l])=>`<a href="#" class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render();return false"><span>${i}</span>${l}</a>`).join('')}</nav>`;
}
S.cache={};S.useCache=false;S.page={};
async function load(key,fn){if(S.useCache&&S.cache[key])return S.cache[key];return S.cache[key]=await fn()}
async function render(){
  if(!S.user)return;
  try{const html=await views[S.tab]();S.useCache=false;shell(html);if(after[S.tab])after[S.tab]()}catch(e){S.useCache=false;shell(`<div class="msg err">${esc(e.message)}</div>`)}
}
function toast(text,ok){const old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast '+(ok?'ok':'err');d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),ok?3500:6000)}
function closeSheet(){const s=document.querySelector('.sbg');if(s)s.remove()}
function openSheet(html,bind){closeSheet();const bg=document.createElement('div');bg.className='sbg';bg.innerHTML=`<div class="sheet">${html}</div>`;
  bg.onclick=e=>{if(e.target===bg)closeSheet()};document.body.appendChild(bg);if(bind)bind(bg.firstElementChild)}
function pageOf(key,rows,per){const n=Math.max(1,Math.ceil(rows.length/per));let p=Math.min(S.page[key]||0,n-1);S.page[key]=p;return {items:rows.slice(p*per,p*per+per),p,n}}
function pager(key,pg){return `<div class="pager"><button data-pg="${key}:-1" ${pg.p<=0?'disabled':''}>‹</button><span>${pg.p+1} / ${pg.n}</span><button data-pg="${key}:1" ${pg.p>=pg.n-1?'disabled':''}>›</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pg]');if(!b)return;const [k,d]=b.dataset.pg.split(':');S.page[k]=(S.page[k]||0)+(+d);S.useCache=true;render()});

/* ---------- views : chaque onglet tient dans l'écran, sans défilement ---------- */
const views={
async dash(){
  const [c,fl,ub]=await Promise.all([load('cash',()=>q(sb.from('v_cash_summary').select('*').limit(1))),load('flows',()=>q(sb.from('v_monthly_flows').select('*').order('month',{ascending:false}).limit(12))),load('ub',()=>q(sb.from('v_unit_balances').select('*').order('unit_number')))]);
  const k=c[0]||{};const f=[...fl].reverse();
  const mx=Math.max(1,...f.map(x=>Math.max(+x.inflows,+x.outflows)));
  const bars=f.map(x=>`<div class="col"><div class="pair"><i class="a" style="height:${+x.inflows/mx*100}%"></i><i class="b" style="height:${+x.outflows/mx*100}%"></i></div><em>${esc(String(x.month).slice(5,7))}</em></div>`).join('');
  return `<div class="grid2">
  <div class="tile kpi"><small>${t('cash')}</small><b class="${+k.cash_balance<0?'neg':'pos'}">${money(k.cash_balance)}</b></div>
  <div class="tile kpi"><small>${t('after')}</small><b>${money(k.balance_after_debts)}</b></div>
  <div class="tile kpi"><small>${t('pending')}</small><b class="warn">${money(k.pending_expenses)}</b></div>
  <div class="tile kpi"><small>${t('arrears')}</small><b class="neg">${money(k.dues_arrears)}</b></div></div>
  <div class="tile fill"><div class="ttl">${t('flows')} <span style="color:var(--ok)">■ ${t('in')}</span><span style="color:var(--pe)">■ ${t('out')}</span></div>${f.length?`<div class="bars">${bars}</div>`:t('none')}</div>
  <div class="units">${ub.map(u=>{const pc=+u.total_due>0?Math.min(100,+u.total_paid/+u.total_due*100):0;return `<div class="tile unit"><b>${esc(u.unit_number)}</b>${u.is_late?`<span class="tag">${u.late_months} ${t('late')}</span>`:''}<div class="pb"><i style="width:${pc}%"></i></div><small>${num(u.total_paid)} / ${num(u.total_due)} · <span class="${+u.arrears>0?'neg':''}">${num(u.arrears)}</span></small></div>`}).join('')}</div>`;
},
async dues(){
  const rows=await load('dues',()=>q(sb.from('v_dues_detail').select('*').order('period_year',{ascending:false}).order('period_month',{ascending:false}).limit(400)));
  const yr=new Date().getFullYear();const cur=rows.filter(r=>+r.period_year===yr);
  const by={};cur.forEach(r=>{by[r.unit_number+'|'+r.period_month]=r});
  const sum=k=>rows.reduce((a,r)=>a+(+r[k]||0),0);
  const head=`<div></div>`+[...Array(12)].map((_,i)=>`<div class="h">${i+1}</div>`).join('');
  const body=S.units.map(u=>`<div class="u" data-u="${esc(u.id)}">${esc(u.unit_number)}</div>`+[...Array(12)].map((_,i)=>{const r=by[u.unit_number+'|'+(i+1)];return `<div class="c ${r?esc(r.status):''}" title="${r?num(r.paid_amount)+' / '+num(r.due_amount):''}"></div>`}).join('')).join('');
  return `<div class="grid3"><div class="tile kpi"><small>${t('due')}</small><b>${num(sum('due_amount'))}</b></div><div class="tile kpi"><small>${t('paid')}</small><b class="pos">${num(sum('paid_amount'))}</b></div><div class="tile kpi"><small>${t('remaining')}</small><b class="neg">${num(sum('remaining'))}</b></div></div>
  <div class="tile fill"><div class="ttl">${t('dues')} ${yr}</div><div class="heat">${head}${body}</div></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>${t('paid')}</span><span><i style="background:var(--pa)"></i>${t('partial')}</span><span><i style="background:var(--pe)"></i>${t('pend')}</span></div>
  <div class="acts"><button class="btn" id="newpay">+ ${t('newpay')}</button><button class="btn sec" id="gen">${t('genDues')}</button></div>`;
},
async exp(){
  const rows=await load('exp',()=>q(sb.from('expenses').select('id,description,amount,expense_date,status,supplier,category_id').is('deleted_at',null).order('expense_date',{ascending:false}).limit(300)));
  const cn=Object.fromEntries(S.cats.map(c=>[c.id,c.name]));
  const tot={};rows.forEach(r=>{const n=cn[r.category_id]||'—';tot[n]=(tot[n]||0)+ +r.amount});
  const cats=Object.entries(tot).sort((a,b)=>b[1]-a[1]).slice(0,5);const mx=Math.max(1,...cats.map(c=>c[1]));
  const all=rows.reduce((a,r)=>a+ +r.amount,0),pend=rows.filter(r=>r.status==='pending').reduce((a,r)=>a+ +r.amount,0);

/* ---------- OCR factures eau / électricité (navigateur, aucune clé API) ---------- */
const POLICES={'0158226':'EAU','01582826':'EAU','0637128':'ELECTRICITE'};
function pickCat(type){const want=type==='EAU'?'eau':'electricite';
  const norm=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const c=S.cats.find(c=>norm(c.name)===want);if(c)$('#ec').value=c.id}
function loadScript(src){return new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>ko(new Error('Chargement impossible (connexion ?)'));document.head.appendChild(e)})}
async function prep(src){
  let bmp;if(src instanceof HTMLCanvasElement){bmp=src}else{bmp=await createImageBitmap(src,{imageOrientation:'from-image'})}
  const w=bmp.width,h=bmp.height,k=Math.min(2.2,2600/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  const c=cv.getContext('2d');c.filter='grayscale(1) contrast(1.5) brightness(1.05)';c.drawImage(bmp,0,0,cv.width,cv.height);return cv}
async function ocrImage(src){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js');
  const cv=await prep(src);const wk=await Tesseract.createWorker('fra');
  try{await wk.setParameters({tessedit_pageseg_mode:'11'});const r=await wk.recognize(cv);return r.data.text}finally{await wk.terminate()}}
async function ocrText(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let all='';
    for(let i=1;i<=Math.min(pdf.numPages,4);i++){
      const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
      let txt='',lastY=null;for(const it of tc.items){if(lastY!==null&&Math.abs(it.transform[5]-lastY)>2)txt+='\n';else if(txt)txt+=' ';txt+=it.str;lastY=it.transform[5]}
      if(txt.replace(/\s/g,'').length<40){const vp=pg.getViewport({scale:2.5});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;txt=await ocrImage(cv)}
      all+='\n'+txt}
    return all}
  return ocrImage(file)}
function parseAmounts(line){const out=[];const re=/\d{1,3}(?:[  .]\d{3})*[.,]\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g;let m;
  while((m=re.exec(line))){let x=m[0].replace(/[\s ]/g,'');
    if(/,\d{2}$/.test(x))x=x.replace(/\./g,'').replace(',','.');else x=x.replace(/,/g,'');
    const v=parseFloat(x);if(isFinite(v)&&v>0)out.push(v)}return out}
function parseInvoice(text){
  const flat=text.replace(/[\s.\-]/g,'');
  const found=Object.keys(POLICES).filter(p=>flat.includes(p));
  const types=[...new Set(found.map(p=>POLICES[p]))];
  if(types.length!==1)return {type:null};
  const police=found[0],type=types[0];
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const bad=/ancien|solde|report|arri[eé]r|d[eé]j[àa]\s*pay/i;
  const all=[];lines.forEach(l=>{if(!bad.test(l))all.push(...parseAmounts(l))});
  const biggest=Math.max(0,...all);
  // 1) libellé lu : « Net à payer » / « Total TTC »
  const pass=[/net\s*[àa]\s*payer|total\s*[àa]\s*payer|montant\s*[àa]\s*payer/i,/total\s*ttc|montant\s*ttc|net\s*ttc|\bttc\b/i];
  for(const re of pass){
    const cands=[];
    lines.forEach((l,i)=>{if(!re.test(l)||bad.test(l))return;
      if(/\bHT\b/i.test(l)&&!/ttc/i.test(l))return;
      let a=parseAmounts(l);if(!a.length&&lines[i+1]&&!bad.test(lines[i+1]))a=parseAmounts(lines[i+1]);
      a=a.filter(v=>v>1||v>=biggest);// un petit montant (≤ 1 MAD) est le droit de timbre
      if(a.length)cands.push(a)});
    if(cands.length){const last=cands[cands.length-1];const amount=last[last.length-1];
      return {type,police,amount,others:last.slice(0,-1),deduced:false}}
  }
  // 2) libellé non lu (photo) : sur ces factures le net à payer est l'avant-dernier montant, suivi du droit de timbre
  if(all.length>=2){
    const a=[...all];let timbre=null;if(a[a.length-1]<=1)timbre=a.pop();
    const amount=a[a.length-1];
    if(timbre!==null&&amount>=Math.max(...a))return {type,police,amount,others:a.slice(0,-1).slice(-3),timbre,deduced:true}}
  return {type,police,amount:null,others:[]}}
async function attachFile(expenseId,f){
  const ext=(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5);
  const path=`expenses/${expenseId}/${uuid()}.${ext}`;
  const up=await sb.storage.from('syndic-documents').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(up.error)throw new Error('Dépense enregistrée, mais justificatif non envoyé : '+up.error.message);
  const bid=(await q(sb.from('buildings').select('id').limit(1)))[0].id;
  await q(sb.from('attachments').insert({building_id:bid,storage_path:path,file_name:f.name.slice(0,120),mime_type:f.type,file_size:f.size,expense_id:expenseId}))}
window.addEventListener('hashchange',boot);
boot();
</script>
